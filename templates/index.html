<!-- templates/index.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Better-Hitster</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<style>
  :root{
    --bg:#0f1113; --card:#151617; --accent:#1DB954; --muted:#9aa0a6; --glass: rgba(255,255,255,0.03);
  }
  html,body{height:100%; margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
  body{background: linear-gradient(180deg,#071018 0%, #0f1113 100%); color:#fff; display:flex; align-items:center; justify-content:center; padding:32px;}
  .card{width:100%; max-width:680px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015)); border-radius:16px; padding:28px; box-shadow: 0 8px 40px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03);}
  .header{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .logo{display:flex; align-items:center; gap:12px;}
  .logo .dot{width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,var(--accent), #19c85b); display:flex; align-items:center; justify-content:center; font-weight:700; color:#031; box-shadow: 0 6px 20px rgba(29,185,84,0.12);}
  h1{margin:0; font-size:20px; letter-spacing:0.2px;}
  p.lead{margin:0; color:var(--muted); font-size:13px;}
  .controls{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap;}
  button.btn{background:var(--accent); color:#042; border:none; padding:12px 18px; border-radius:999px; font-weight:700; cursor:pointer; box-shadow:0 8px 24px rgba(29,185,84,0.08);}
  button.ghost{background:transparent; border:1px solid rgba(255,255,255,0.06); color:#fff; padding:10px 14px; border-radius:999px; cursor:pointer;}
  .center{display:flex; gap:18px; margin-top:22px; align-items:center;}
  .album{width:220px; min-width:160px; border-radius:12px; overflow:hidden; background:var(--glass); display:flex; align-items:center; justify-content:center; padding:12px;}
  #cover{width:100%; height:100%; object-fit:cover; display:block;}
  .info{flex:1;}
  .info h2{margin:0; font-size:20px;}
  .info h3{margin:6px 0 0 0; color:var(--muted); font-weight:600; font-size:14px;}
  .info .year{margin-top:12px; font-size:28px; color:var(--accent); font-weight:800;}
  .note{margin-top:12px; color:var(--muted); font-size:13px;}
  .small{font-size:12px; color:var(--muted);}
</style>
</head>
<body>
  <div class="card" role="main">
    <div class="header">
      <div class="logo">
        <div class="dot">BH</div>
        <div>
          <h1>Better-Hitster</h1>
          <p class="lead">Guess the year — play on your Spotify app</p>
        </div>
      </div>
      <div id="auth-area">
        <a id="login-link" href="/login"><button class="btn" id="login-btn">Login with Spotify</button></a>
        <button class="ghost" id="logout-btn" style="display:none">Logout</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="new-song-btn">▶️ New Song</button>
      <button class="ghost" id="reveal-btn" disabled>👀 Reveal</button>
      <div style="flex:1"></div>
      <div class="small">Tip: open Spotify on your phone and make it active before pressing "New Song".</div>
    </div>

    <div class="center">
      <div class="album" id="album" style="display:none">
        <img id="cover" src="" alt="album cover">
      </div>
      <div class="info" id="info">
        <div id="status" class="small">Not playing</div>
      </div>
    </div>

    <div class="note" id="note-area" style="margin-top:18px"></div>
  </div>

<script>
async function api(path, opts){
  const res = await fetch(path, opts);
  try { return await res.json(); } catch(e){ return { error: "invalid json response" }; }
}

async function updateAuthUI(){
  const r = await api("/me");
  if(r.logged_in){
    document.getElementById("login-btn").style.display = "none";
    document.getElementById("login-link").style.display = "none";
    document.getElementById("logout-btn").style.display = "inline-block";
  } else {
    document.getElementById("login-btn").style.display = "inline-block";
    document.getElementById("login-link").style.display = "inline-block";
    document.getElementById("logout-btn").style.display = "none";
  }
}

document.getElementById("logout-btn").onclick = async () => {
  await fetch("/logout");
  updateAuthUI();
  document.getElementById("status").textContent = "Logged out";
  document.getElementById("album").style.display = "none";
  document.getElementById("reveal-btn").disabled = true;
};

document.getElementById("new-song-btn").onclick = async () => {
  document.getElementById("reveal-btn").disabled = true;
  document.getElementById("album").style.display = "none";
  document.getElementById("status").textContent = "⌛ Loading song...";
  document.getElementById("note-area").textContent = "";

  const r = await api("/play");
  if(r.error){
    document.getElementById("status").textContent = "Error";
    document.getElementById("note-area").textContent = "Play Error: " + r.error;
    return;
  }
  document.getElementById("status").textContent = "▶️ Playing – listen on your Spotify app";
  document.getElementById("reveal-btn").disabled = false;
};

document.getElementById("reveal-btn").onclick = async () => {
  const r = await api("/reveal");
  if(r.error){
    document.getElementById("note-area").textContent = "Reveal error: " + r.error;
    return;
  }
  document.getElementById("cover").src = r.image || "";
  document.getElementById("album").style.display = r.image ? "block" : "none";
  document.getElementById("info").innerHTML = `<h2>${r.name}</h2><h3>🎤 ${r.artist}</h3><div class="year">📅 ${r.year}</div>`;
  document.getElementById("status").textContent = "Revealed";
};

window.addEventListener("load", () => {
  updateAuthUI();
});
</script>
</body>
</html>
