<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guess The Year</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --gold: #c9a84c;
      --gold-dim: #7a6330;
      --text: #e8e0d0;
      --text-dim: #666;
      --red: #c0392b;
      --green: #27ae60;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Header */
    .header {
      text-align: center;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 12vw, 5rem);
      letter-spacing: 0.08em;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 60px rgba(201,168,76,0.3);
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* Record */
    .record-wrap {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .record {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle at center,
        #1a1a1a 0px,
        #1a1a1a 2px,
        #111 2px,
        #111 4px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 0 3px #222, 0 20px 60px rgba(0,0,0,0.8);
      transition: transform 0.3s ease;
    }

    .record.spinning {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .record-label {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #1a1200;
      text-align: center;
      line-height: 1.2;
      overflow: hidden;
      position: relative;
    }

    .record-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      position: absolute;
      inset: 0;
      display: none;
    }

    .record-label.has-image img {
      display: block;
    }

    .record-hole {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg);
      position: absolute;
      z-index: 2;
    }

    /* Song info */
    .song-info {
      text-align: center;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .song-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.05em;
      color: var(--text);
      display: none;
    }

    .song-artist {
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: none;
    }

    .song-year-result {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--gold);
      display: none;
      letter-spacing: 0.05em;
    }

    .waiting-text {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* Year input */
    .guess-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .year-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4rem;
      letter-spacing: 0.1em;
      color: var(--text);
      text-align: center;
      min-width: 200px;
      cursor: default;
    }

    .year-display.placeholder {
      color: var(--border);
    }

    .year-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    .year-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(201,168,76,0.5);
    }

    .year-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: none;
    }

    .year-range-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* Buttons */
    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 0.9rem 2.5rem;
      border: 1px solid var(--gold-dim);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn:hover {
      background: var(--gold);
      color: #0a0a00;
      border-color: var(--gold);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-secondary {
      border-color: var(--border);
      color: var(--text-dim);
    }

    .btn-secondary:hover {
      background: var(--border);
      color: var(--text);
      border-color: var(--border);
    }

    /* Result feedback */
    .result-badge {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border: 1px solid;
      display: none;
      text-align: center;
    }

    .result-badge.correct {
      color: var(--green);
      border-color: var(--green);
      background: rgba(39,174,96,0.08);
    }

    .result-badge.close {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201,168,76,0.08);
    }

    .result-badge.off {
      color: var(--red);
      border-color: var(--red);
      background: rgba(192,57,43,0.08);
    }

    /* Error */
    .error-msg {
      font-size: 0.65rem;
      color: var(--red);
      letter-spacing: 0.1em;
      text-align: center;
      display: none;
      padding: 0.5rem;
    }

    /* Login screen */
    .login-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .login-screen .desc {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      line-height: 2;
      text-transform: uppercase;
      max-width: 300px;
    }

    /* Logout link */
    .logout-link {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .logout-link:hover {
      color: var(--text);
      border-bottom-color: var(--text-dim);
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    /* State visibility */
    .state-logged-out { display: none; }
    .state-logged-in  { display: none; }

    body.logged-out .state-logged-out { display: flex; }
    body.logged-in  .state-logged-in  { display: flex; }
  </style>
</head>
<body>

<div class="container">

  <!-- Header always visible -->
  <div class="header">
    <div class="title">Guess The Year</div>
    <div class="subtitle">How well do you know your music?</div>
  </div>

  <!-- LOGGED OUT STATE -->
  <div class="state-logged-out login-screen" style="flex-direction:column; gap:2rem;">
    <div class="desc">
      A random song plays.<br/>
      You guess the year it came out.<br/>
      That's it.
    </div>
    <a href="/login" style="width:100%;">
      <button class="btn" style="width:100%;">Connect Spotify</button>
    </a>
  </div>

  <!-- LOGGED IN STATE -->
  <div class="state-logged-in" style="flex-direction:column; align-items:center; gap:2rem; width:100%;">

    <!-- Record visual -->
    <div class="record-wrap">
      <div class="record" id="record">
        <div class="record-label" id="recordLabel">
          <span id="labelText">?</span>
          <img id="albumArt" src="" alt=""/>
        </div>
        <div class="record-hole"></div>
      </div>
    </div>

    <!-- Song info (hidden until reveal) -->
    <div class="song-info">
      <div class="waiting-text" id="waitingText">Press play to start</div>
      <div class="song-name" id="songName"></div>
      <div class="song-artist" id="songArtist"></div>
      <div class="song-year-result" id="songYearResult"></div>
    </div>

    <div class="divider"></div>

    <!-- Guess section -->
    <div class="guess-section" id="guessSection" style="opacity:0.3; pointer-events:none;">
      <div class="year-display placeholder" id="yearDisplay">— — — —</div>
      <input
        type="range"
        class="year-slider"
        id="yearSlider"
        min="1960"
        max="2024"
        value="1992"
        step="1"
      />
      <div class="year-range-labels">
        <span>1960</span>
        <span>2024</span>
      </div>
    </div>

    <div class="result-badge" id="resultBadge"></div>
    <div class="error-msg" id="errorMsg"></div>

    <!-- Buttons -->
    <button class="btn" id="playBtn" onclick="playRound()">▶ Play Random Song</button>
    <button class="btn" id="guessBtn" onclick="submitGuess()" disabled>Submit Guess</button>
    <button class="btn btn-secondary" id="nextBtn" onclick="nextRound()" style="display:none;">Next Song →</button>

    <a href="/logout" class="logout-link">Disconnect</a>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let gameState = 'idle'; // idle | playing | guessed

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    const res = await fetch('/me');
    const data = await res.json();
    document.body.classList.add(data.logged_in ? 'logged-in' : 'logged-out');
  }

  // ── Slider live update ─────────────────────────────────────────────────────
  const slider = document.getElementById('yearSlider');
  const yearDisplay = document.getElementById('yearDisplay');

  slider.addEventListener('input', () => {
    yearDisplay.textContent = slider.value;
    yearDisplay.classList.remove('placeholder');
  });

  // ── Play ───────────────────────────────────────────────────────────────────
  async function playRound() {
    if (gameState === 'playing') return;

    setError('');
    setResult('');
    document.getElementById('playBtn').disabled = true;
    document.getElementById('playBtn').textContent = '⏳ Loading...';

    try {
      const res = await fetch('/play');
      const data = await res.json();

      if (!res.ok) {
        setError(data.error || 'Something went wrong.');
        document.getElementById('playBtn').disabled = false;
        document.getElementById('playBtn').textContent = '▶ Play Random Song';
        return;
      }

      gameState = 'playing';

      // Spin record
      document.getElementById('record').classList.add('spinning');
      document.getElementById('labelText').textContent = '♪';

      // Reset UI
      document.getElementById('songName').style.display = 'none';
      document.getElementById('songArtist').style.display = 'none';
      document.getElementById('songYearResult').style.display = 'none';
      document.getElementById('waitingText').style.display = 'block';
      document.getElementById('waitingText').textContent = 'Listening...';

      // Enable guess
      const guessSection = document.getElementById('guessSection');
      guessSection.style.opacity = '1';
      guessSection.style.pointerEvents = 'auto';

      // Reset slider
      slider.value = 1992;
      yearDisplay.textContent = '— — — —';
      yearDisplay.classList.add('placeholder');

      document.getElementById('guessBtn').disabled = false;
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('playBtn').style.display = 'none';

    } catch (e) {
      setError('Network error. Try again.');
      document.getElementById('playBtn').disabled = false;
      document.getElementById('playBtn').textContent = '▶ Play Random Song';
    }
  }

  // ── Submit Guess ───────────────────────────────────────────────────────────
  async function submitGuess() {
    if (gameState !== 'playing') return;

    const guessedYear = parseInt(slider.value);
    if (yearDisplay.classList.contains('placeholder')) {
      setError('Move the slider to pick a year first.');
      return;
    }

    setError('');
    document.getElementById('guessBtn').disabled = true;

    try {
      const res = await fetch('/reveal');
      const data = await res.json();

      if (!res.ok) {
        setError(data.error || 'Could not reveal song.');
        document.getElementById('guessBtn').disabled = false;
        return;
      }

      gameState = 'guessed';
      const actualYear = parseInt(data.year);
      const diff = Math.abs(guessedYear - actualYear);

      // Show song info
      document.getElementById('waitingText').style.display = 'none';
      document.getElementById('songName').textContent = data.name;
      document.getElementById('songName').style.display = 'block';
      document.getElementById('songArtist').textContent = data.artist;
      document.getElementById('songArtist').style.display = 'block';
      document.getElementById('songYearResult').textContent = data.year;
      document.getElementById('songYearResult').style.display = 'block';

      // Album art
      if (data.image) {
        document.getElementById('albumArt').src = data.image;
        document.getElementById('recordLabel').classList.add('has-image');
      }

      // Stop spinning
      document.getElementById('record').classList.remove('spinning');

      // Result feedback
      if (diff === 0) {
        setResult(`🎯 Exact! You nailed it`, 'correct');
      } else if (diff <= 2) {
        setResult(`🔥 Only ${diff} year${diff > 1 ? 's' : ''} off`, 'close');
      } else if (diff <= 5) {
        setResult(`📀 ${diff} years off`, 'close');
      } else {
        setResult(`💀 ${diff} years off — you guessed ${guessedYear}`, 'off');
      }

      document.getElementById('nextBtn').style.display = 'block';

    } catch (e) {
      setError('Network error. Try again.');
      document.getElementById('guessBtn').disabled = false;
    }
  }

  // ── Next Round ─────────────────────────────────────────────────────────────
  function nextRound() {
    gameState = 'idle';
    document.getElementById('record').classList.remove('spinning');
    document.getElementById('recordLabel').classList.remove('has-image');
    document.getElementById('albumArt').src = '';
    document.getElementById('labelText').textContent = '?';
    document.getElementById('songName').style.display = 'none';
    document.getElementById('songArtist').style.display = 'none';
    document.getElementById('songYearResult').style.display = 'none';
    document.getElementById('waitingText').textContent = 'Press play to start';
    document.getElementById('waitingText').style.display = 'block';
    document.getElementById('guessSection').style.opacity = '0.3';
    document.getElementById('guessSection').style.pointerEvents = 'none';
    document.getElementById('playBtn').textContent = '▶ Play Random Song';
    document.getElementById('playBtn').disabled = false;
    document.getElementById('playBtn').style.display = 'block';
    document.getElementById('guessBtn').disabled = true;
    document.getElementById('nextBtn').style.display = 'none';
    setResult('');
    setError('');
    yearDisplay.textContent = '— — — —';
    yearDisplay.classList.add('placeholder');
    slider.value = 1992;
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function setError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  function setResult(msg, type) {
    const el = document.getElementById('resultBadge');
    el.textContent = msg;
    el.className = 'result-badge';
    if (type) el.classList.add(type);
    el.style.display = msg ? 'block' : 'none';
  }

  init();
</script>
</body>
</html>
