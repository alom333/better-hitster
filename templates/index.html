<!DOCTYPE html>
<html>
<head>
    <title>Better Hitster</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        button {
            background: #1DB954;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        img {
            width: 300px;
            border-radius: 15px;
            margin-top: 20px;
        }

        #info {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>🎵 Better Hitster</h1>

<a href="/login"><button>Login with Spotify</button></a>

<br>

<button onclick="play()">Play Random Song</button>
<button onclick="reveal()">Reveal</button>
<button onclick="play()">New Song</button>

<div id="info"></div>

<script>
function play() {
    fetch("/play")
}

function reveal() {
    fetch("/reveal")
    .then(res => res.json())
    .then(data => {
        document.getElementById("info").innerHTML = `
            <h2>${data.name}</h2>
            <h3>${data.artist}</h3>
            <h4>${data.year}</h4>
            <img src="${data.album_image}">
        `;
    });
}
</script>

</body>
</html>
